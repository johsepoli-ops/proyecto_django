<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>

<body>

    <h1>Sistema de Gestión de Mantenimiento</h1>

    <h2>Iniciar sesión</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div>
            <label for="username">
                Usuario:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">
                Contraseña:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <br>

    <a href="{% url 'accounts:forgot_password' %}">
        ¿Olvidaste tu contraseña?
    </a>

</body>

</html>
