<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
</head>

<body>

    <h1>Crear nueva contraseña</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>
        La contraseña debe tener:
    </p>

    <ul>
        <li>Mínimo 10 caracteres</li>
        <li>Una mayúscula</li>
        <li>Una minúscula</li>
        <li>Un número</li>
        <li>Un carácter especial</li>
    </ul>

    <form method="post">

        {% csrf_token %}

        <div>
            <label for="password1">
                Nueva contraseña:
            </label>

            <input
                type="password"
                id="password1"
                name="password1"
                required
            >
        </div>

        <br>

        <div>
            <label for="password2">
                Repetir contraseña:
            </label>

            <input
                type="password"
                id="password2"
                name="password2"
                required
            >
        </div>

        <br>

        <button type="submit">
            Cambiar contraseña
        </button>

    </form>

</body>

</html>
