<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
</head>

<body>

    <h1>Recuperar contraseña</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="email">
            Correo electrónico:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br>
        <br>

        <button type="submit">
            Generar código
        </button>

    </form>

    <br>

    <a href="{% url 'accounts:login' %}">
        Volver al login
    </a>

</body>

</html>
