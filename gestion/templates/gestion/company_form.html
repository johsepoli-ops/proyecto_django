<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>

<body>

    <h1>{{ title }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>

    </form>

    <br>

    <a href="{% url 'gestion:company_list' %}">
        Volver a empresas
    </a>

</body>

</html>
